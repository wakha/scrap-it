services:
  db:
    image: mysql:8.0
    container_name: scraper_db
    command: --default-authentication-plugin=mysql_native_password
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - scraper_network

  scraper:
    build: .
    container_name: scraper_app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - LOG_LEVEL=${LOG_LEVEL}
      - HEADLESS_MODE=${HEADLESS_MODE}
      - SCREENSHOT_ENABLED=${SCREENSHOT_ENABLED}
      - SCRAPE_DELAY=${SCRAPE_DELAY}
    volumes:
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots
      - ./src:/app/src
    command: python src/main.py
    networks:
      - scraper_network

  api:
    build: .
    container_name: scraper_api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - API_KEY=${API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    command: python src/api/main.py
    networks:
      - scraper_network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  scraper_network:
    driver: bridge
