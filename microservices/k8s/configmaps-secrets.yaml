apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: scraper-microservices
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-config
  namespace: scraper-microservices
data:
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "scraper_db"
  DB_USER: "scraper"
---
apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: scraper-microservices
type: Opaque
stringData:
  DB_PASSWORD: "scraper123"  # Change this in production
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: scraper-microservices
type: Opaque
stringData:
  API_KEY: "production-api-key-change-me"  # Change this in production
