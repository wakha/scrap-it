services:
  # Zookeeper - Required by Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka - Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9093,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Kafka UI - Web interface for Kafka
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - microservices-network

  # MySQL Database - Owned by ETL Service
  mysql:
    image: mysql:8.0
    container_name: etl-database
    command: --default-authentication-plugin=mysql_native_password
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../scrap-services/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Analyzer Service
  analyzer-service:
    build:
      context: .
      dockerfile: ./analyzer-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      RUNNING_IN_DOCKER: "true"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SERVICE_PORT: ${ANALYZER_SERVICE_PORT}
      METRICS_PORT: ${ANALYZER_METRICS_PORT}
    ports:
      - "${ANALYZER_SERVICE_PORT}"
      - "${ANALYZER_METRICS_PORT}"
    networks:
      - microservices-network
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: 2

  # Scraper Service
  scraper-service:
    build:
      context: .
      dockerfile: ./scraper-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      RUNNING_IN_DOCKER: "true"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      HEADLESS_MODE: ${HEADLESS_MODE}
      SCREENSHOT_ENABLED: ${SCREENSHOT_ENABLED}
      METRICS_PORT: ${SCRAPER_METRICS_PORT}
    ports:
      - "${SCRAPER_METRICS_PORT}"
    volumes:
      - ./scraper-service/screenshots:/app/screenshots
    networks:
      - microservices-network
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: 3

  # ETL Service
  etl-service:
    build:
      context: .
      dockerfile: ./etl-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      RUNNING_IN_DOCKER: "true"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      METRICS_PORT: ${ETL_METRICS_PORT}
    ports:
      - "${ETL_METRICS_PORT}"
    networks:
      - microservices-network
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: 2

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    container_name: api-gateway
    depends_on:
      - analyzer-service
    env_file:
      - .env
    environment:
      RUNNING_IN_DOCKER: "true"
      SERVICE_PORT: ${API_GATEWAY_PORT}
      METRICS_PORT: ${API_GATEWAY_METRICS_PORT}
      API_KEY: ${API_KEY}
      ANALYZER_SERVICE_URL: ${ANALYZER_SERVICE_URL}
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
      - "${API_GATEWAY_METRICS_PORT}:${API_GATEWAY_METRICS_PORT}"
    networks:
      - microservices-network
    restart: unless-stopped

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - microservices-network
    restart: unless-stopped

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    networks:
      - microservices-network
    restart: unless-stopped

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:

networks:
  microservices-network:
    driver: bridge
